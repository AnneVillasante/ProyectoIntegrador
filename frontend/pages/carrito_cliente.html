<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Carrito de Venta Física - Lunaria Threads</title>
    <!-- Tipografías -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600;700&family=Lora:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../assets/css/styles.css">
    <link rel="stylesheet" href="../assets/css/carrito.css">
    <script src="../assets/js/config.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="../components/layout.js" defer></script>
</head>
<body>
    <div id="navbar"></div>

    <main class="container">
        <div class="cart-page-title">
            <h2 id="cart-title">Carrito de Venta Física</h2>
        </div>

        <!-- Sección para selección de cliente -->
        <div id="customer-selection-container" class="customer-selection-container">
            <h4>Asignar Cliente a la Venta</h4>
            <div class="customer-selector-wrapper">
                <input type="text" id="customer-search-input" class="customer-selector" placeholder="Buscar cliente por nombre o correo...">
                <div id="customer-search-results" class="search-results"></div>
                <button id="open-new-customer-modal" class="btn-secondary">Nuevo Cliente</button>
            </div>
            <div id="current-customer-info" class="current-customer-info" style="display: none;">
                <span>Cliente asignado: <strong id="current-customer-name"></strong></span>
                <button id="clear-customer-btn" class="btn-clear-customer" title="Quitar cliente">&times;</button>
            </div>
        </div>

        <div class="cart-container">
            <!-- Sección de productos en el carrito -->
            <div class="cart-items-list">
                <div id="cart-items-container"></div>

                <!-- Mensaje para carrito vacío -->
                <div id="empty-cart-message" class="empty-cart" style="display: none;">
                    <i class="fas fa-shopping-cart"></i>
                    <p>El carrito de venta está vacío.</p>
                    <a href="/productos" class="btn-primary">Agregar productos</a>
                </div>
            </div>

            <!-- Resumen y Finalización de la compra -->
            <div class="cart-summary">
                <h3>Resumen de la Venta</h3>
                <div class="summary-item">
                    <span>Subtotal</span>
                    <span id="summary-subtotal">S/ 0.00</span>
                </div>
                <!-- Sección de Cupón de Descuento -->
                <div class="coupon-section">
                    <div class="input-group">
                        <input type="text" id="coupon-code" class="form-control" placeholder="Código de cupón">
                        <button id="apply-coupon-btn" class="btn-secondary">Aplicar</button>
                    </div>
                    <div id="coupon-feedback" class="feedback-message" style="display: none;"></div>
                </div>
                <!-- Fin de Sección de Cupón -->
                <div class="summary-item">
                    <span>Descuentos</span>
                    <span id="summary-discounts" class="discount-text">-S/ 0.00</span>
                </div>
                <div class="summary-total">
                    <span>Total</span>
                    <span id="summary-total">S/ 0.00</span>
                </div>

                <!-- Botón para ir a la página de pago -->
                <button id="proceed-to-payment-button" class="btn-checkout disabled">Proceder al Pago</button>
            </div>
        </div>
    </main>

    <div id="footer"></div>

    <!-- Modal para Nuevo Cliente -->
    <div id="new-customer-modal" class="modal" style="display: none;">
        <div class="modal-content">
            <span class="close-modal-btn">&times;</span>
            <h3>Crear Nuevo Cliente</h3>
            <form id="new-customer-form">
                <input type="text" id="new-customer-nombres" placeholder="Nombres" required>
                <input type="text" id="new-customer-apellidos" placeholder="Apellidos" required>
                <input type="email" id="new-customer-email" placeholder="Correo Electrónico" required>                
                <input type="text" id="new-customer-dni" placeholder="DNI (Opcional)">
                <input type="tel" id="new-customer-telefono" placeholder="Teléfono (Opcional)">
                <button type="submit" class="btn-primary">Guardar Cliente</button>
                <p id="modal-error-message" class="error-text" style="display: none;"></p>
            </form>
        </div>
    </div>

    <script src="../assets/js/carrito_cliente.js"></script>
    <script src="../components/navbar.js" defer></script>
</body>
</html>
