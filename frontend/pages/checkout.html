<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Finalizar Compra - Lunaria Threads</title>
    <link rel="stylesheet" href="../assets/css/styles.css">
    <link rel="stylesheet" href="../assets/css/checkout.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="../assets/js/config.js" defer></script>
    <script src="https://js.stripe.com/v3/"></script>
    <script src="../components/layout.js" defer></script>
</head>
<body>
    <div id="navbar"></div>

    <main class="container">
        <div class="checkout-page-title">
            <h2>Finalizar Compra</h2>
        </div>

        <div class="checkout-container">
            <div class="order-summary">
                <h3>Resumen del Pedido</h3>
                <div id="order-items-container">
                    <!-- Los items del pedido se cargarán aquí -->
                </div>
                <div class="summary-total">
                    <span>Total</span>
                    <span id="summary-total">$0.00</span>
                </div>
            </div>

            <div class="checkout-form">
                <h3>Detalles de Entrega y Pago</h3>
                <form id="checkout-form">
                    <!-- Método de Entrega -->
                    <div class="form-group">
                        <label for="metodo-entrega">Método de Entrega</label>
                        <select id="metodo-entrega" name="metodoEntrega" required>
                            <option value="recojo">Recojo en Tienda</option>
                            <option value="delivery">Delivery</option>
                        </select>
                    </div>

                    <!-- Dirección de Entrega (solo para delivery) -->
                    <div class="form-group" id="direccion-entrega-group" style="display: none;">
                        <label for="direccion-entrega">Dirección de Entrega</label>
                        <input type="text" id="direccion-entrega" name="direccionEntrega" placeholder="Ingresa tu dirección">
                    </div>

                    <!-- Método de Pago -->
                    <div class="form-group">
                        <label for="metodo-pago">Método de Pago</label>
                        <select id="metodo-pago" name="metodoPago" required>
                            <option value="tarjeta">Tarjeta de Crédito/Débito</option>
                            <option value="yape">Yape</option>
                            <option value="plin">Plin</option>
                        </select>
                    </div>

                    <!-- Contenedor para Stripe Card Element -->
                    <div class="form-group" id="card-element-container" style="display: none;">
                        <label for="card-element">Tarjeta de Crédito o Débito</label>
                        <div id="card-element"></div>
                        <div id="card-errors" role="alert"></div>
                    </div>

                    <button type="submit" id="confirm-order-button" class="btn-primary">Confirmar Pedido</button>
                </form>
            </div>
        </div>
    </main>

    <div id="footer"></div>

    <script src="../assets/js/checkout.js"></script>
</body>
</html>
