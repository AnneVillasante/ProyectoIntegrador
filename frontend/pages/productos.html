<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lunaria Threads | Productos</title>
  <link rel="stylesheet" href="../assets/css/styles.css">
  <link rel="stylesheet" href="../assets/css/productos.css">
  <script src="../assets/js/config.js" defer></script>
  <script src="../components/layout.js" defer></script>
</head>
<body>
  <div id="navbar"></div>

  <!-- SECCIÓN DE PRODUCTOS -->
  <main class="container">
    <div class="productos-section">
      <h1 class="productos-title">Colección Destacada</h1>
      <p class="productos-subtitle">Descubre nuestras prendas y accesorios más populares</p>
      <div id="categorias-container" class="categorias-filtros">
        <!-- Los filtros de categoría se cargarán aquí -->
      </div>
    </div>

    <div class="productos-container">
      <!-- Barra lateral de filtros -->
      <aside class="filtros-sidebar">
        <h3>Filtros</h3>
        <button id="limpiarFiltrosBtn" class="btn-limpiar-filtros" hidden>Limpiar Filtros</button>
        <div id="filtroSubcategorias" class="filtro-grupo">
          <!-- Las subcategorías se cargarán aquí -->
        </div>
        <div class="filtro-grupo">
          <h4>Precio</h4>
          <div class="precio-filtro">
            <input type="range" id="priceRange" min="0" max="500" value="500">
            <div class="precio-valores">
              <span>S/ 0</span> - <span id="priceValue">S/ 500</span>
            </div>
          </div>
        </div>
      </aside>

      <!-- Contenido principal de productos -->
      <div class="productos-content">
        <div class="productos-header">
          <span class="ordenar-label">Ordenar por:</span>
          <div class="ordenar-container">
            <select id="ordenarProductos">
              <option value="recomendado">Recomendado</option>
              <option value="precio-asc">Precio: Menor a Mayor</option>
              <option value="precio-desc">Precio: Mayor a Menor</option>
              <option value="nombre-asc">Nombre: A-Z</option>
              <option value="nombre-desc">Nombre: Z-A</option>
            </select>
          </div>
        </div>
        <div id="activeFiltersContainer" class="active-filters-container">
          <!-- Las etiquetas de filtros activos se mostrarán aquí -->
        </div>
        <div class="productos-grid" id="productosGrid">
          <!-- Los productos se cargarán aquí -->
        </div>
        <div class="paginacion" id="paginacion">
          <!-- La paginación se cargará aquí -->
        </div>
      </div>
    </div>
  </main>

  <div id="footer"></div>
<script src="../components/navbar.js" defer></script>
<script src="../assets/js/productos.js" defer></script>
</body>
</html>
