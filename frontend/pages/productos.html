<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lunaria Threads | Productos</title>
  <link rel="stylesheet" href="../assets/css/styles.css">
  <link rel="stylesheet" href="../assets/css/productos.css">
  <script src="../components/layout.js" defer></script>
</head>
<body>
  <div id="navbar"></div>

  <!-- SECCIÓN DE PRODUCTOS -->
  <main class="productos-section container">
    <h1 class="productos-title">Colección Destacada</h1>
    <p class="productos-subtitle">Descubre nuestras prendas y accesorios más populares</p>

    <div class="filtros-container">
      <button class="btn-filtros-toggle" id="filtrosToggle">
        <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="4" y1="21" x2="4" y2="14"></line><line x1="4" y1="10" x2="4" y2="3"></line><line x1="12" y1="21" x2="12" y2="12"></line><line x1="12" y1="8" x2="12" y2="3"></line><line x1="20" y1="21" x2="20" y2="16"></line><line x1="20" y1="12" x2="20" y2="3"></line><line x1="1" y1="14" x2="7" y2="14"></line><line x1="9" y1="8" x2="15" y2="8"></line><line x1="17" y1="16" x2="23" y2="16"></line></svg>
        <span>Filtros</span>
      </button>
      <div class="ordenar-por">
        <label for="ordenar">Ordenar por:</label>
        <select id="ordenar" class="select-ordenar">
          <option value="default">Relevancia</option>
          <option value="precio-asc">Precio: Menor a Mayor</option>
          <option value="precio-desc">Precio: Mayor a Menor</option>
          <option value="nombre-asc">Alfabéticamente: A-Z</option>
          <option value="nombre-desc">Alfabéticamente: Z-A</option>
        </select>
      </div>
    </div>

    <div class="productos-layout">
      <aside class="filtros-sidebar" id="filtrosSidebar">
        <div class="filtros-sidebar-header">
          <h2>Filtros</h2>
          <button class="btn-cerrar-sidebar" id="cerrarSidebar">&times;</button>
        </div>
        <div class="filtro-grupo">
          <h3>Categorías</h3>
          <div id="categoriasFiltro">
            <!-- Las categorías se cargarán aquí dinámicamente -->
          </div>
        </div>
      </aside>

      <div class="productos-grid" id="productosGrid">
        <!-- PRODUCTS_PLACEHOLDER -->
      </div>
      <div class="paginacion-container" id="paginacionContainer">
        <!-- Los controles de paginación se insertarán aquí -->
      </div>
    </div>
  </main>

  <div id="footer"></div>
<script src="../components/navbar.js" defer></script>
<script src="../assets/js/productos.js" defer></script>
</body>
</html>
